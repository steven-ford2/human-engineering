name: Publish Human Engineering
on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'workspace.json'
      - 'domains/task-analysis/**'
      - 'domains/pvi-measurement/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: human-engineering-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r platform/requirements.txt
      - run: python -m unittest discover -s platform/tests -v
      - run: node --test platform/tests/test_measurement.mjs platform/tests/test_workbench.mjs platform/tests/test_workbench_quality.mjs
      - run: python platform/build.py --profile pages
      - run: python tools/check_links.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

